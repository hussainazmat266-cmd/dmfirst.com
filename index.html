<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DMFirst — Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

    <button class="lang">🇺🇸 EN</button>

  <main id="view"></main>
  <nav class="nav">

    <button class="wheel" onclick="navigate('wheel')" data-page="wheel"><strong>◉</strong><small>Wheel</small></button>
    <button onclick="navigate('promotion')" data-page="promotion"><i>♟</i><small>Promotion</small></button>
    <button onclick="navigate('account')" data-page="account"><i>●</i><small>Account</small></button>

<div id="toast"></div>
<script src="app.js"></script>

</html>
